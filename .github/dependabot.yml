# The actions the workflows use are pinned by commit (the version in a comment beside each): Dependabot proposes the
# newer ones once a week, pin and comment together. A release is proposed only once it is a week old (cooldown): a
# compromised action version is usually found and pulled within days, before it reaches these workflows.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  # (hookshot) The Python packages the release's Python carries (requirements.txt, nx2/prompt_requirements.txt), pinned
  # and installed with pip --require-hashes from requirements-lock.txt: proposed weekly after the same week's cooldown.
  # A proposal changes the pins; scripts/python_lock.py then writes the lock again (tests/test_python_lock.py fails on a
  # stale lock, so a proposal is not merged without it). The builder's .NET project has no NuGet packages: nothing for
  # Dependabot there.
  - package-ecosystem: pip
    directories: [/, /nx2]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ['*']
