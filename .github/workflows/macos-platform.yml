name: macOS platform

on:
  push:
    branches: [codex/macos-rebased-release]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-posix:
    # Apple Silicon runner: verify the native arm64 game and runtime target.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build configuration test
        run: |
          python -I -B tests/test_macos_build_path.py
          python -I -B tests/test_toolchain_platform.py
          python -I -B tests/test_run_all_declarations.py
          python -I third_party/a64-kit/lift/build_emit.py
          python -I scripts/macos/check-arm64-translation.py

      - name: Link native arm64 macOS executable
        run: |
          printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/macos-probe.c"
          clang -target arm64-apple-macos13.3 -mcpu=apple-m1 "$RUNNER_TEMP/macos-probe.c" -o "$RUNNER_TEMP/macos-probe"
          lipo "$RUNNER_TEMP/macos-probe" -verify_arch arm64
          printf 'int main(void) { unsigned __int128 v = 0, e = 0; return __atomic_compare_exchange_n(&v, &e, 1, 0, __ATOMIC_SEQ_CST, __ATOMIC_SEQ_CST); }\n' \
            > "$RUNNER_TEMP/arm64-atomic-probe.c"
          clang -target arm64-apple-macos13.3 -mcpu=apple-m1 "$RUNNER_TEMP/arm64-atomic-probe.c" \
            -o "$RUNNER_TEMP/arm64-atomic-probe"

      - name: Compile macOS POSIX host shims
        run: |
          mkdir -p "$RUNNER_TEMP/a64-generated"
          printf '/* Generated lift helpers are unused by these host translation units. */\n' \
            > "$RUNNER_TEMP/a64-generated/a64_suyu.h"
          printf '/* Generated per-game floating-point helpers are unused by these host translation units. */\n' \
            > "$RUNNER_TEMP/a64-generated/a64_fpx.h"
          test "$(uname -m)" = arm64
          python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
          clang -target arm64-apple-macos13.3 -mcpu=apple-m1 -fsyntax-only -D_GNU_SOURCE -Wno-everything \
            -I"$RUNNER_TEMP/a64-generated" -Ihost/posix -Ihost -Ithird_party/a64-kit/rt \
            host/posix/win32_posix.c host/hos_main.c host/rx_backend.c host/hos_setjmp.c
          clang -target arm64-apple-macos13.3 -mcpu=apple-m1 -fsyntax-only -D_GNU_SOURCE -Wno-everything \
            -I"$RUNNER_TEMP/a64-generated" -Ihost/posix -Ihost -Ithird_party/a64-kit/rt \
            host/posix/display_sdl.c host/posix/macos_stubs.c

  macos-builder:
    # Builds a native arm64 downloadable CLI and dependencies; it never receives or builds game data.
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-macos/deps
          key: macos-builder-deps-${{ hashFiles('scripts/macos/deps.sh') }}

      - name: Install dependency build tools
        run: brew install cmake nasm meson ninja

      - name: Build builder dependencies
        run: bash scripts/macos/deps.sh

      - name: Validate bundled builder toolchain
        env:
          WGPU_NATIVE: ${{ github.workspace }}/build-macos/deps/wgpu-native
          HOOKSHOT_SDL2: ${{ github.workspace }}/build-macos/deps/sdl2/lib/libSDL2-2.0.0.dylib
          HOOKSHOT_FFMPEG: ${{ github.workspace }}/build-macos/deps/ffmpeg
        run: |
          build-macos/deps/python/bin/python3 -I -B tests/test_macos_build_path.py
          build-macos/deps/python/bin/python3 -I -c "import tkinter"
          build-macos/deps/python/bin/python3 -I -c \
            "import platform; assert platform.machine() == 'arm64', platform.machine()"
          build-macos/deps/python/bin/python3 -I -c \
            "import runpy; runpy.run_path('nx2/make_game.py')['check_macos_toolchain']()"
          python -I scripts/macos/check-renderer.py
          lipo build-macos/deps/python/bin/python3 -verify_arch arm64
          lipo build-macos/deps/sdl2/lib/libSDL2-2.0.0.dylib -verify_arch arm64
          lipo build-macos/deps/wgpu-native/lib/libwgpu_native.dylib -verify_arch arm64
          for lib in build-macos/deps/ffmpeg/lib/*.a; do lipo "$lib" -verify_arch arm64; done

      - name: Package CLI builder
        run: bash scripts/macos/package-builder.sh

      - name: Verify packaged builder starts
        run: |
          test -d build-macos/package/HookshotBuilder/HookshotBuilder.app
          test -x build-macos/package/HookshotBuilder/HookshotBuilder.app/Contents/Resources/tools/python/bin/python3
          test -f build-macos/package/HookshotBuilder/HookshotBuilder.app/Contents/Resources/tools/source/builder/linux/hookshot_builder.py
          test ! -L build-macos/package/HookshotBuilder/HookshotBuilder.app/Contents/Resources/tools
          lipo build-macos/package/HookshotBuilder/HookshotBuilder.app/Contents/MacOS/applet -verify_arch arm64
          cd build-macos/package/HookshotBuilder
          ./HookshotBuilder.command --help

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HookshotBuilder-macos-arm64
          path: |
            build-macos/HookshotBuilder-macos-arm64.zip
            build-macos/HookshotBuilder-macos-arm64.app.zip
          if-no-files-found: error

  release:
    name: macOS release asset
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos-builder
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HookshotBuilder-macos-arm64
          path: dist
      - name: macOS builder to the release
        run: scripts/release_upload.sh "$GITHUB_REF_NAME" dist/HookshotBuilder-macos-arm64.zip dist/HookshotBuilder-macos-arm64.app.zip
