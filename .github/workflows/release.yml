# Releases with release-please (docs/versioning.md). On every push to main it keeps one release pull request open: the
# next version, from the Conventional Commit titles of the pull requests merged since the last release, and its
# CHANGELOG.md entry. Merging that pull request tags the merge commit and makes the release as a draft. This workflow
# then builds the release's files with the Linux AppImage and Windows builder workflows, which attach them, and
# publishes the release once all of them are there. No game data is involved.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # (the release pull request and its branch; the tag and the draft release)
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # (called here, not started by the tag: a tag made with GITHUB_TOKEN starts no workflow)
  linux:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/linux-appimage.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    # (id-token and attestations: the build provenance of the files)
    permissions:
      contents: write
      id-token: write
      attestations: write

  windows:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/windows-builder.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    # (id-token and attestations: the build provenance of the files)
    permissions:
      contents: write
      id-token: write
      attestations: write

  # The draft becomes the release players see, with every file attached: the setup and the builder's update check read
  # the latest release's hookshot-setup.txt. Before that, the release gets SHA256SUMS (the SHA-256 of every file, signed
  # like the files) and the "Which file do I download?" table under its notes (scripts/release_files.sh). A version with
  # a prerelease part (2.1.0-rc.1) is a prerelease, never "latest". To attach the files again, re-run the failed jobs of
  # this run: the files are replaced.
  publish:
    needs: [release-please, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # (id-token and attestations: SHA256SUMS's build provenance)
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag }}
      WINDOWS_BY_HAND: ${{ vars.CI_RELEASE_WINDOWS == 'false' }}
    steps:
      - if: env.WINDOWS_BY_HAND == 'true'
        run: >-
          echo "::notice::$TAG stays a draft: upload HookshotBuilder.exe and hookshot-setup.txt, run
          scripts/release_files.sh finish $TAG, then publish it."
      - if: env.WINDOWS_BY_HAND != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: SHA256SUMS and the table of the files
        if: env.WINDOWS_BY_HAND != 'true'
        run: scripts/release_files.sh finish "$TAG" SHA256SUMS
      - name: Every file is there
        if: env.WINDOWS_BY_HAND != 'true'
        run: >-
          scripts/release_files.sh check "$TAG" hookshot-linux.txt hookshot-setup.txt HookshotBuilder.exe
          "Hookshot-$TAG-x86_64.AppImage" "Hookshot-$TAG-x86_64.AppImage.zsync"
      - if: env.WINDOWS_BY_HAND != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: SHA256SUMS
      - name: Publish the release
        if: env.WINDOWS_BY_HAND != 'true'
        run: |
          if [[ $TAG == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
