# Keep this file on the default branch for the schedule. The fork preview is enabled;
# upstream adoption requires DOCS_PROGRESS_ENABLED=true and Pages configuration.
name: Refresh documentation progress

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-progress-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.repository == 'bibigurl-yum/Hookshot' || vars.DOCS_PROGRESS_ENABLED == 'true') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out documentation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.repository == 'bibigurl-yum/Hookshot' && 'docs/starlight-preview' || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked documentation dependencies
        run: npm ci
      - name: Collect a complete public progress snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run progress:sync
      - name: Build and validate documentation
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          DOCS_PROGRESS_FEED_URL: ''
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          DOCS_SOURCE_REPOSITORY: ${{ github.repository }}
          DOCS_SOURCE_BRANCH: ${{ github.repository == 'bibigurl-yum/Hookshot' && 'docs/starlight-preview' || github.event.repository.default_branch }}
        run: |
          npm run build
          npm run check
      - name: Upload checked website only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the checked snapshot and site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
